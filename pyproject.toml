[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saul-goodman-courtroom"
version = "1.0.0"
description = "Strategic AI agents in a simulated courtroom: deterministic judge, game-theoretic analysis, live visualisation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "pyright>=1.1.380"]

[project.scripts]
courtroom = "courtroom.cli:main"

[tool.setuptools.packages.find]
include = ["courtroom*"]

[tool.setuptools.package-data]
"courtroom.viz" = ["web/*", "web/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running Monte-Carlo tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B905"]

[tool.pyright]
include = ["courtroom"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
